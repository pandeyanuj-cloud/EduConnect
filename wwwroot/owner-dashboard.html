<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Classes - EduConnect</title>
  <link rel="stylesheet" href="css/style.css?v=20260917" />
</head>
<body class="owner-body">
  <div class="owner-shell">
    <aside class="owner-sidebar">
      <a class="owner-brand" href="owner-dashboard.html"><span class="brand-mark">E</span>Edu<span class="accent">Connect</span></a>
      <nav class="owner-nav" aria-label="Class owner navigation">
        <a class="owner-nav-link active" href="owner-dashboard.html">My Classes</a>
        <a class="owner-nav-link" href="owner-enquiries.html">Student Enquiries</a>
        <a class="owner-nav-link" href="owner-reviews.html">Reviews</a>
      </nav>
      <button class="owner-logout" type="button" data-logout>Logout</button>
    </aside>
    <main class="owner-main">
      <header class="owner-header">
        <div><p class="eyebrow">Class owner workspace</p><h1>My Classes</h1><p class="owner-intro">Add and manage the classes students can discover.</p></div>
        <span class="owner-user-chip" id="ownerName">Class owner</span>
      </header>
      <section class="owner-layout">
        <div class="owner-panel owner-form-panel">
          <div class="panel-header"><div><p class="eyebrow" id="formEyebrow">New listing</p><h2 id="formTitle">Add a class</h2></div><button class="mini-btn ghost hidden" id="cancelEdit" type="button">Cancel edit</button></div>
          <form id="classForm" class="owner-form">
            <input id="classId" type="hidden" value="0" />
            <label for="subject">Subject</label><input id="subject" type="text" required placeholder="e.g. Mathematics" />
            <div class="owner-form-grid"><div><label for="fee">Fee per year</label><input id="fee" type="number" min="0" step="1" required placeholder="15000" /></div><div><label for="rating">Rating</label><input id="rating" type="number" min="0" max="5" step="0.1" value="0" /></div></div>
            <div class="owner-form-grid"><div><label for="location">Location</label><input id="location" type="text" required placeholder="Virar" /></div><div><label for="standard">Standard</label><input id="standard" type="text" required placeholder="10th" /></div></div>
            <label for="mode">Mode</label><select id="mode"><option>Both</option><option>Online</option><option>Offline</option></select>
            <label for="imageFile">Class image</label><label class="image-upload" id="imageUploadBox" for="imageFile"><span class="image-upload-title">Upload class image</span><span class="image-upload-hint">Click to choose a JPG, JPEG or PNG</span><span class="image-upload-name" id="imageFileName">No image selected</span></label><input id="imageFile" class="visually-hidden-file" type="file" accept="image/jpeg,image/png" /><img id="imagePreview" class="owner-image-preview hidden" alt="Selected class preview" /><button id="changeImageBtn" class="mini-btn ghost change-image-btn hidden" type="button">Change Image</button><input id="imageUrl" type="hidden" />
            <label for="description">Short description</label><textarea id="description" rows="4" placeholder="What makes this class a good fit?"></textarea>
            <label for="materialProvided">Study material included in the fee</label><input id="materialProvided" type="text" placeholder="e.g. Notes, worksheets and monthly test papers" />
            <label for="contactNumber">Contact number for students</label><input id="contactNumber" type="tel" maxlength="20" placeholder="e.g. 9876543210" />
            <label for="classTimings">Class timings</label><input id="classTimings" type="text" maxlength="200" placeholder="e.g. Mon-Fri, 4:00 PM-6:00 PM" />
            <button class="owner-primary-btn" type="submit" id="saveClassBtn">Save class</button>
            <p class="owner-message" id="classMessage" role="status"></p>
          </form>
        </div>
        <div class="owner-panel owner-list-panel"><div class="panel-header"><div><p class="eyebrow">Published listings</p><h2>Your classes</h2></div><span id="classCount" class="badge">0</span></div><div id="ownerClassCards" class="owner-class-grid"></div></div>
      </section>
    </main>
  </div>
  <script src="js/owner-dashboard.js?v=20261005-class-contact"></script>
</body>
</html>
