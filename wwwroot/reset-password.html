<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset password - EduConnect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="navbar">
  <div class="logo">Edu<span class="accent">Connect</span></div>
  <a href="login.html" class="btn ghost">Back to login</a>
</div>

<div class="auth-card">
  <h2>Reset password</h2>
  <p>Choose a new password for your EduConnect account.</p>
  <form id="resetPasswordForm">
    <label>New Password</label>
    <div class="password-field">
      <input type="password" name="newPassword" required minlength="6">
      <button type="button" class="password-toggle" aria-label="Show password">
        <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
      </button>
    </div>
    <label>Rewrite Password</label>
    <div class="password-field">
      <input type="password" name="rewritePassword" required minlength="6">
      <button type="button" class="password-toggle" aria-label="Show password">
        <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
      </button>
    </div>
    <button type="submit" class="btn accent full">Reset password</button>
  </form>
  <p id="resetMessage" class="hint"></p>
  <p id="resetLoginLink" class="switch-link hidden"><a href="login.html">Return to Login</a></p>
</div>

<script src="js/auth.js"></script>
</body>
</html>
