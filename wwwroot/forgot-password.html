<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot password - EduConnect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="navbar">
  <div class="logo">Edu<span class="accent">Connect</span></div>
  <a href="login.html" class="btn ghost">Back to login</a>
</div>

<div class="auth-card">
  <h2>Forgot password</h2>
  <p>Enter your registered email to receive a one-time password.</p>
  <form id="forgotPasswordForm">
    <label>Email</label>
    <input type="email" name="email" id="forgotEmail" required>
    <button type="submit" class="btn accent full">Send OTP</button>
  </form>
  <form id="verifyOtpForm" class="hidden">
    <label>OTP</label>
    <input type="text" name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required>
    <button type="submit" class="btn accent full">Verify OTP</button>
  </form>
  <p id="forgotMessage" class="hint"></p>
</div>

<script src="js/auth.js"></script>
</body>
</html>
